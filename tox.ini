[tox]
skipsdist = True
usedevelop = True

envlist = 
    py{310,311,312}-dj{42,51,52}-wagtail{64,70,72}
    py313-dj{51,52}-wagtail{64,70,72}
    py314-dj52-wagtail{64,70,72}
    py314-djmain-wagtailmain

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
install_command = pip install -e ".[testing,cdn,frontdoor]" -U {opts} {packages}
commands =
    django-admin check
    django-admin test  --pythonpath {toxinidir}
deps =
    wagtail64: wagtail>=6.4,<6.5
    wagtail70: wagtail>=7.0,<7.1
    wagtail72: wagtail>=7.2,<7.3
    dj42: Django>=4.2,<4.3
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<5.3
    djmain: git+https://github.com/django/django.git@main#egg=Django
    wagtailmain: git+https://github.com/wagtail/wagtail.git@main#egg=Wagtail

setenv =
    DJANGO_SETTINGS_MODULE = wagtail_azure_cdn.tests.settings
    PYTHONPATH = {toxinidir}

[testenv:flake8]
basepython=python3
commands=flake8 wagtail_azure_cdn

[testenv:black]
basepython=python3
commands=black --check ./

[testenv:isort]
basepython=python3
commands=isort --check-only --diff wagtail_azure_cdn
