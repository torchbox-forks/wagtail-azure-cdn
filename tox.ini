[tox]
envlist = 
    py{39,310,311,312}-dj42-wagtail{52,63,64,70}
    py{310,311,312,313}-dj{51,52}-wagtail{63,64}
    py{313}-djmain-wagtailmain

[testenv]
extras =
    cdn
    frontdoor
    testing
commands =
    django-admin check
    django-admin test  --pythonpath {toxinidir}
deps =
    wagtail52: wagtail>=5.2,<5.3
    wagtail63: wagtail>=6.3,<6.4
    wagtail64: wagtail>=6.4,<6.5
    wagtail70: wagtail>=7.0,<7.1
    django42: Django>=4.2,<4.3
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
    djmain: git+https://github.com/django/django.git@main#egg=Django
    wagtailmain: git+https://github.com/wagtail/wagtail.git@main#egg=Wagtail

setenv =
    DJANGO_SETTINGS_MODULE = wagtail_azure_cdn.tests.settings
    PYTHONPATH = {toxinidir}

; Separate environment for testing main branches
[testenv:main]
basepython = python3.13
extras =
    cdn
    frontdoor
    testing
commands =
    django-admin check
    django-admin test --pythonpath {toxinidir}
deps =
    git+https://github.com/django/django.git@main#egg=Django
    git+https://github.com/wagtail/wagtail.git@main#egg=Wagtail
setenv =
    DJANGO_SETTINGS_MODULE = wagtail_azure_cdn.tests.settings
    PYTHONPATH = {toxinidir}

[testenv:flake8]
basepython=python3
commands=flake8 wagtail_azure_cdn

[testenv:black]
basepython=python3
commands=black --check ./

[testenv:isort]
basepython=python3
commands=isort --check-only --diff wagtail_azure_cdn
